services:
  postgres:
    image: postgres:16-alpine
    container_name: financix-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: financix
      POSTGRES_USER: financix
      POSTGRES_PASSWORD: financix_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financix -d financix"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
